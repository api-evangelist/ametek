description: >-
  AMETEK Powervar's published REST API definition for the iSite PRO documents ONLY the 200 success
  response for each of its three operations. It publishes no error catalogue, no status codes other
  than 200, no problem+json media type and no error envelope shape.
problem_types: []
note: >-
  This is a recorded absence, deliberately not filled in. The definition states that
  "Authentication is required for access to all API features", which in practice implies a 401 on
  an unauthenticated call, but AMETEK Powervar does not document that response and this pipeline
  does not invent status codes it has not seen. An integrator cannot tell from the published
  contract what an auth failure, a malformed request or a device fault returns.
gap:
  what_is_missing: Any documented non-200 response.
  remedy: >-
    Publish the 401 (and any 4xx/5xx) responses with their body shape, ideally as RFC 9457
    application/problem+json, alongside the existing 200 definitions.
