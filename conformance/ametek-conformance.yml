domain_standards:
  - id: snmp-ups-mib
    name: UPS MIB (RFC 1628) field vocabulary
    conforms: partial
    evidence: >-
      The UpsStatus response reproduces the RFC 1628 UPS-MIB object vocabulary almost field for
      field — BatteryStatus, EstimatedChargeRemaining, EstimatedMinutesRemaining, BatteryVoltage,
      BatteryCurrent, BatteryTemperature, InputLineBads, InputVoltage, InputFrequency,
      OutputSource, OutputVoltage, OutputFrequency, OutputPower, OutputPercentLoad — and the alarm
      names map onto the RFC 1628 upsAlarm well-known alarm identifiers (upsAlarmOnBattery,
      upsAlarmLowBattery, upsAlarmOutputOverload, upsAlarmChargerFailed, upsAlarmFanFailure,
      upsAlarmFuseFailure, upsAlarmDepletedBattery, upsAlarmOnBypass, upsAlarmInputBad,
      upsAlarmOutputBad, upsAlarmShutdownImminent, upsAlarmDiagnosticTestFailed and others).
      Marked partial rather than true: AMETEK Powervar nowhere CLAIMS RFC 1628 conformance in the
      REST API definition, and the JSON names are CamelCase re-spellings rather than the MIB
      object identifiers. This is recorded as an observed vocabulary alignment, not a certified
      conformance.
    spec_location: openapi/ametek-powervar-isite-pro-openapi.yml#/components/schemas/UpsStatus
    reward_only_note: >-
      Recorded because a monitoring platform that already speaks UPS-MIB can map this API with no
      bespoke connector. Not asserted as a provider claim.
