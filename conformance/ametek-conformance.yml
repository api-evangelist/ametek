standards:
  - id: rest
    name: REST over HTTP
    conforms: true
    evidence: >-
      A55-00202 REV B is titled "Rest API Definition" and publishes three resource-oriented GET
      operations over HTTP/HTTPS returning JSON.
  - id: http-basic-auth
    name: HTTP Basic Authentication (RFC 7617)
    conforms: true
    evidence: >-
      "Basic Authentication supported" — A55-00202 REV B section 1.2; the worked examples send an
      Authorization: Basic header.
  - id: json
    name: JSON (RFC 8259)
    conforms: true
    evidence: '"All response bodies are in JSON format." — A55-00202 REV B section 1.2.'
  - id: mdns
    name: mDNS / DNS-SD service discovery (RFC 6762 / RFC 6763)
    conforms: true
    evidence: >-
      "Although not part of the API, mDNS is supported for dynamic discovery." — A55-00202 REV B
      section 1.2. The adapter advertises itself on the local network rather than living at a
      fixed vendor host.
  - id: rfc3339
    name: RFC 3339 timestamps
    conforms: true
    evidence: >-
      Alarm Timestamp and whoAreYou time are published in Zulu RFC 3339 form
      (e.g. "2021-07-28T16:28:26Z"). Note this is NOT uniform across the API — UpsStatus
      publishes ManufactureDate as "2021-02-01" and BatteryReplaceDate as "03/01/2021" in the
      same response body.
