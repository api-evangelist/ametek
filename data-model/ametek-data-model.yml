  - from: Adapter
    to: UpsStatus
    type: has_one
    via: implicit
    confidence: medium
    evidence: >-
      Implicit, not declared by a $ref or an id field. One adapter is fitted to one UPS, and
      /UpsStatus takes no parameters, so the status returned is always that of the UPS behind the
      adapter being called. UpsStatus.SerialNumber is the UPS serial and is distinct from
      WhoAreYou.serial, which is the ADAPTER serial — the two must not be conflated.
