description: >-
  Entity-relationship graph derived from the schemas of the AMETEK Powervar iSite PRO REST API.
  A small, flat model: the adapter identifies itself, and reports the state and alarms of the one
  UPS it is fitted to. There are no resource ids, no cross-resource references and no id-prefix
  scheme — every response is a live read of one device.
