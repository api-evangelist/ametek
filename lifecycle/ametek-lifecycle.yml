  published_statement: >-
    "It will be explicitly clear in firmware upgrades if any version is deprecated, breaking any
    systems built upon them."
  note: >-
    A real, stated deprecation commitment — breaking changes iterate the URI version and
    deprecation is announced in the firmware upgrade. It is delivered as release-note prose, not
    as RFC 8594 Deprecation/Sunset response headers, so an agent cannot detect an impending
    sunset at runtime.
