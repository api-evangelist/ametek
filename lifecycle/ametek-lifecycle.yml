  published_statement: >-
    "Protocol versioning is built into the URI. Any feature breaking changes implemented in
    firmware will iterate this protocol versioning. Multiple protocol versions may be available
    at the same time. Currently the only supported protocol version is v1 as defined in this
    document."
  note: >-
    Version is bound to device FIRMWARE, not to a hosted service. A fleet of iSite PRO adapters
    can be running different protocol versions at once, and the operator controls when each one
    moves by choosing when to apply firmware.
