distribution_note: >-
  AMETEK's developer artifacts are not distributed through package registries. Crank Storyboard —
  AMETEK's embedded-GUI product — ships its APIs as a compiled C library (libgreio.a with the
  gre/greio.h header), a Lua module, and a JavaScript engine binding, all delivered inside the
  Storyboard SDK download rather than via npm, PyPI or Maven. The iSite PRO REST API has no client
  library at all; it is called directly over HTTP. Neither surface has a registry metadata endpoint
  to query, so version and published dates are recorded as null below rather than guessed.
