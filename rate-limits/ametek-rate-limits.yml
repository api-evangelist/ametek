specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: AMETEK
providerId: ametek
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Electronic Instruments
  - Test and Measurement
  - Rate Limiting
description: >-
  AMETEK does not publish public network-API rate limits. Instrument control
  APIs are typically bus-speed bound (USB, GPIB, LXI, Ethernet) rather than
  request-per-second throttled, and behavior is documented per instrument in
  the brand-specific programmer's manual rather than a central rate-limit
  policy.
notes: >-
  No central rate-limit policy. Instrument-specific limits live in each
  product's programming manual (SCPI command throughput, etc.).
sources:
  - https://www.ametek.com
responseCodes: {}
limits:
  - name: Per-Instrument Bus Throughput
    scope: device
    metric: varies
    limit: 'see instrument programmer manual (SCPI / IVI / LXI)'
policies:
  - name: Per-Device Documentation
    description: >-
      Throughput, command pacing, and error handling are documented per
      instrument family by AMETEK's component brands; consult the relevant
      programmer manual.
maintainers:
