description: >-
  AMETEK publishes no rate limits for any of its API surfaces. An honest zero, read from the one
  document AMETEK Powervar publishes about the API.
notes: >-
  A55-00202 REV B ("Rest API Definition") documents each of the three operations in full — request
  type, URL, URL parameters, data parameters, request headers, success response code, worked
  request and worked response — and lists no limit, no quota, no throttle and no rate-limit
  header. Every operation's "Request Headers" field reads N/A, and the only success code published
  is 200, so there is no 429 either. Nothing about throttling is stated anywhere in the document.
  Supersedes the 2026-05-04 bulk-sweep entry, which asserted a "Per-Instrument Bus Throughput"
  limit that AMETEK does not publish.
responseCodes: {}
headers: []
limits: []
policies: []
practical_guidance: >-
  Not a published limit — operational context an integrator needs. The endpoint is an embedded
  management card on power equipment, served by the customer's own device on their own LAN, not by
  vendor infrastructure. Polling pressure is bounded by the adapter, so poll conservatively and
  treat a slow or refused response as a device or network condition rather than as throttling.
